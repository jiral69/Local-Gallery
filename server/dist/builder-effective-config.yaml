directories:
  output: dist
  buildResources: build
appId: com.localgallery.app
productName: Local Gallery
asar: false
files:
  - filter:
      - '**/*'
      - react-build/**/*
win:
  target: nsis
  icon: icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
electronVersion: 45.2.1
